name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm extension:artifact
      - run: pnpm pack:check
      - run: node scripts/extract-changelog-section.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Create or reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Newton Browser ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" \
              artifacts/newton-browser-*.tgz \
              artifacts/newton-browser-extension-*.zip \
              artifacts/newton-browser-extension-*.zip.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              artifacts/newton-browser-*.tgz \
              artifacts/newton-browser-extension-*.zip \
              artifacts/newton-browser-extension-*.zip.sha256 \
              --title "Newton Browser ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md
          fi
      - name: Publish npm package
        shell: bash
        run: |
          version="$(node -p "require('./apps/mcp-server/package.json').version")"
          if npm view "newton-browser@${version}" version >/dev/null 2>&1; then
            echo "newton-browser@${version} is already published; skipping duplicate publish."
          else
            npm publish "./artifacts/newton-browser-${version}.tgz" --access public --provenance
          fi
