name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and reconcile (for example, v0.4.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select release tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
          git checkout --detach "$release_tag"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm pack:check
      - run: node scripts/extract-changelog-section.mjs "$RELEASE_TAG" > release-notes.md
      - name: Create or reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Newton Browser ${RELEASE_TAG#v}" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" \
              artifacts/newton-browser-*.tgz \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              artifacts/newton-browser-*.tgz \
              --title "Newton Browser ${RELEASE_TAG#v}" \
              --notes-file release-notes.md
          fi
      - name: Publish npm package
        shell: bash
        run: |
          version="$(node -p "require('./apps/mcp-server/package.json').version")"
          if npm view "newton-browser@${version}" version >/dev/null 2>&1; then
            echo "newton-browser@${version} is already published; skipping duplicate publish."
          else
            npm publish "./artifacts/newton-browser-${version}.tgz" --access public --provenance
          fi
