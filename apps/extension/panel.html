<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Newton Browser</title>
    <link rel="stylesheet" href="src/panel.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Newton Browser</h1>
        <span id="status" class="status" data-connected="false">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Disconnected</span>
        </span>
      </header>
      <form id="pairing" hidden>
        <label for="pairing-secret">Pairing secret</label>
        <div class="pairing-row">
          <input id="pairing-secret" type="password" autocomplete="off" spellcheck="false" required>
          <button id="pairing-save" type="submit">Pair</button>
        </div>
        <p id="pairing-message">Run <code>newton-browser --doctor</code>, then paste the one-time secret.</p>
      </form>
      <section id="sessions" class="sessions" hidden>
        <div class="sessions-heading">
          <h2>Active sessions</h2>
          <button id="stop-all" type="button">Stop all</button>
        </div>
        <ul id="session-list"></ul>
      </section>
      <a class="setup-guide" href="onboarding.html" target="_blank">Setup guide</a>
      <p id="version" class="version"></p>
      <p id="version-skew" class="version-skew" hidden>Update Newton Browser so the host and extension versions match.</p>
    </main>
    <script type="module" src="src/panel.js"></script>
  </body>
</html>
