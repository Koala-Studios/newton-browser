<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Frame fixture</title></head>
<body>
  <p id="frame-provenance">frame-loading</p>
  <button id="frame-button">Same-origin frame button</button>
  <button id="frame-stale-target">Frame stale target</button>
  <button id="rerender-frame-target" type="button">Rerender frame target</button>
  <button id="navigate-frame-document" type="button">Navigate frame document</button>
  <label>Frame input <input></label>
  <output id="frame-status">frame-idle</output>
  <div id="nested-frame-slot"></div>
  <script>
    const parameters = new URLSearchParams(location.search);
    const label = parameters.get("label") || "Same-origin";
    const revision = Number(parameters.get("revision") || 1);
    document.querySelector("#frame-provenance").textContent = `${label} frame revision ${revision}`;
    document.querySelector("#frame-button").textContent = `${label} frame button`;
    document.querySelector("#rerender-frame-target").addEventListener("click", () => {
      document.querySelector("#frame-stale-target").outerHTML = '<button id="frame-fresh-target">Frame fresh target</button>';
      document.querySelector("#frame-status").textContent = "frame-target-rerendered";
    });
    document.querySelector("#navigate-frame-document").addEventListener("click", () => {
      parameters.set("revision", String(revision + 1));
      location.assign(`${location.pathname}?${parameters}`);
    });
    const nestedOrigin = parameters.get("nestedOrigin");
    if (nestedOrigin && parameters.get("leaf") !== "1") {
      const nested = document.createElement("iframe");
      nested.id = "nested-oopif-frame";
      nested.title = "Nested OOPIF frame";
      nested.src = `${nestedOrigin}/frame.html?leaf=1&label=Nested-OOPIF`;
      document.querySelector("#nested-frame-slot").append(nested);
    }
  </script>
</body>
</html>
